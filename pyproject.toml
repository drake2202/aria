[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aria"
version = "1.1.0"
description = "Native macOS/Linux launcher for Legend Online (Flash)"
readme = "linux/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyQt5>=5.15",
    "PyQtWebEngine>=5.15",
    "requests>=2.28",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-requests",
    "pre-commit>=3.7",
]

[project.scripts]
aria = "aria.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aria*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

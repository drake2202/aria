name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install without PyQt5/PyQtWebEngine — CI has no display
          pip install requests keyring pytest pytest-cov ruff mypy types-requests

      - name: Lint (ruff)
        run: ruff check aria/ tests/

      - name: Type-check (mypy)
        run: mypy aria/domain/ aria/infrastructure/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ --cov=aria --cov-report=term-missing -q
